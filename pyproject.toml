[project]
name = "antifraud-system"
version = "0.2.1"
description = "antifraud-system dependencies"
requires-python=">=3.11,<3.12"

dependencies = [
    "catboost",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "requests"
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "antifraud"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна бд - адрес в DATABAE_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]
