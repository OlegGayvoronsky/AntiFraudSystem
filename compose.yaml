services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antifraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antifraud"]
      interval: 5s
      timeout: 3s
      retries: 20

  warm-start:
    profiles: ["init"]
    build: .
    command:
      - uv
      - run
      - --no-sync
      - python
      - src/antifraud/make_warm_start.py
      - --source
      - /data/history.csv
      - --chunk
      - "20000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/antifraud
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/antifraud
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: